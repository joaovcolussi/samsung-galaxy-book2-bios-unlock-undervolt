<!doctype html>
<html><head><meta charset="utf-8"><title>GPU 0 fps</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block}</style>
</head><body><canvas id="c" width="1600" height="900"></canvas>
<script>
// Carga fixa por quadro (para comparar FPS entre etapas). ITER via ?it=N.
const IT = parseInt(new URLSearchParams(location.search).get('it') || '48');
const c = document.getElementById('c'); const gl = c.getContext('webgl2', {antialias:false, powerPreference:'high-performance'});
let lost = 0; c.addEventListener('webglcontextlost', e => { lost++; document.title = 'GPU LOST ' + lost; e.preventDefault(); });
const vs = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
const fs = `#version 300 es
precision highp float; uniform float t; uniform vec2 r; out vec4 o;
void main(){
  vec2 uv = gl_FragCoord.xy / r; vec3 a = vec3(uv, t*0.1); float s = 0.;
  for (int i = 0; i < ${IT}; i++) {
    a = abs(a) / dot(a, a) - vec3(0.53, 0.41, 0.77 + 0.01*sin(t));
    s += sin(a.x*3.1 + float(i)) * cos(a.y*2.7) + exp(-abs(a.z));
  }
  o = vec4(0.5 + 0.5*sin(s), 0.5 + 0.5*cos(s*0.7), fract(s*0.01), 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) document.title = 'GPU ERRO ' + gl.getShaderInfoLog(s); return s; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(pr); gl.useProgram(pr);
const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const ut = gl.getUniformLocation(pr, 't'), ur = gl.getUniformLocation(pr, 'r');
let n = 0, t0 = performance.now();
function f(now){
  gl.uniform1f(ut, now/1000); gl.uniform2f(ur, c.width, c.height); gl.drawArrays(gl.TRIANGLES, 0, 3); n++;
  if (now - t0 >= 1000) { if (!lost) document.title = 'GPU ' + (n*1000/(now-t0)).toFixed(2) + ' fps'; n = 0; t0 = now; }
  requestAnimationFrame(f);
}
requestAnimationFrame(f);
</script></body></html>
